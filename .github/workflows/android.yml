name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet Packages
      run: nuget restore SMAPILoader.sln

    - name: Build Android App
      run: |
        msbuild SMAPILoader.sln /p:Configuration=Release /p:Platform=Any CPU /t:SMAPIGameLoader:SignAndroidPackage

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: smapi-launcher-apk
        path: SMAPIGameLoader/bin/Release/*-Signed.apk
